<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="車メンテ">
  <title>車メンテナンス</title>
  <style>
    :root{
      --bg:#f3f6fa;--surface:#fff;--surface2:#f8fafc;--text:#0f172a;--muted:#64748b;
      --line:#dfe7f0;--accent:#2563eb;--accent-soft:#eff6ff;--ok:#15803d;--ok-soft:#f0fdf4;
      --warn:#b45309;--warn-soft:#fffbeb;--danger:#dc2626;--danger-soft:#fef2f2;
      --shadow:0 8px 28px rgba(15,23,42,.08);--radius:18px;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100dvh}
    button,input,select,textarea{font:inherit}
    button{touch-action:manipulation}
    .app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:94px}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:20px;font-weight:850;letter-spacing:.01em}
    .brand small{display:block;font-size:10px;color:var(--muted);font-weight:650;margin-top:1px}
    .icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;color:var(--text);font-weight:750;cursor:pointer}
    .car-strip{display:flex;gap:8px;overflow:auto;padding-top:10px;scrollbar-width:none}
    .car-strip::-webkit-scrollbar{display:none}
    .car-chip{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:13px;font-weight:750;cursor:pointer}
    .car-chip.active{background:var(--text);border-color:var(--text);color:#fff}
    main{padding:14px 14px 0}
    .hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
    .hero-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
    .hero-name{font-size:22px;font-weight:850}
    .hero-sub{font-size:12px;color:#cbd5e1;margin-top:4px;line-height:1.5}
    .mileage-box{text-align:right}
    .mileage-label{font-size:10px;color:#bfdbfe;font-weight:700}
    .mileage{font-size:25px;font-weight:850;line-height:1.15}
    .mileage span{font-size:12px;font-weight:650}
    .hero-btn{margin-top:7px;border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:6px 10px;font-size:11px;font-weight:750;cursor:pointer}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
    .summary-box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.11);border-radius:13px;padding:10px 8px;text-align:center}
    .summary-num{font-size:20px;font-weight:850}
    .summary-label{font-size:10px;color:#cbd5e1;margin-top:2px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 10px}
    .section-title{font-size:15px;font-weight:850}
    .section-note{font-size:11px;color:var(--muted)}
    .ghost-btn{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer}
    .maint-list{display:flex;flex-direction:column;gap:10px}
    .maint-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 2px 10px rgba(15,23,42,.035)}
    .maint-card.overdue{border-color:#fecaca;background:linear-gradient(180deg,#fff,#fff7f7)}
    .maint-card.soon{border-color:#fde68a;background:linear-gradient(180deg,#fff,#fffdf5)}
    .maint-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .maint-name{font-size:15px;font-weight:850}
    .status{border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;white-space:nowrap}
    .status.none{background:#f1f5f9;color:var(--muted)}
    .status.ok{background:var(--ok-soft);color:var(--ok)}
    .status.soon{background:var(--warn-soft);color:var(--warn)}
    .status.overdue{background:var(--danger-soft);color:var(--danger)}
    .targets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .target{background:var(--surface2);border-radius:12px;padding:10px}
    .target-label{font-size:10px;color:var(--muted);font-weight:700}
    .target-value{font-size:14px;font-weight:850;margin-top:3px}
    .target-remain{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35}
    .last-line{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
    .card-actions{display:flex;gap:8px;margin-top:12px}
    .record-small{flex:1;border:0;background:var(--text);color:#fff;border-radius:11px;padding:10px;font-size:12px;font-weight:850;cursor:pointer}
    .setting-small{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:11px;padding:10px 12px;font-size:12px;font-weight:750;cursor:pointer}
    .empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}
    .fab{position:fixed;right:max(18px,calc((100vw - 560px)/2 + 18px));bottom:88px;z-index:15;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:14px 18px;font-weight:850;box-shadow:0 10px 28px rgba(37,99,235,.32);cursor:pointer}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);z-index:25;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
    .nav-btn{border:0;background:transparent;color:#94a3b8;padding:8px 4px;font-size:11px;font-weight:750;cursor:pointer}
    .nav-btn span{display:block;font-size:18px;line-height:1.1;margin-bottom:3px}
    .nav-btn.active{color:var(--accent)}
    .history-card,.settings-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
    .history-top{display:flex;justify-content:space-between;gap:10px}
    .history-title{font-size:14px;font-weight:850}
    .history-date{font-size:11px;color:var(--muted)}
    .history-meta{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.55}
    .history-note{font-size:12px;margin-top:8px;background:var(--surface2);border-radius:10px;padding:9px}
    .settings-title{font-size:14px;font-weight:850}
    .settings-sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
    .settings-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .primary-btn,.secondary-btn,.danger-btn{border-radius:12px;padding:11px 14px;font-size:13px;font-weight:850;cursor:pointer}
    .primary-btn{border:0;background:var(--accent);color:#fff}
    .secondary-btn{border:1px solid var(--line);background:#fff;color:var(--text)}
    .danger-btn{border:1px solid #fecaca;background:#fff;color:var(--danger)}
    .settings-list{display:flex;flex-direction:column;gap:8px}
    .settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
    .settings-row-name{font-size:13px;font-weight:800}
    .settings-row-sub{font-size:10px;color:var(--muted);margin-top:4px}
    .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
    .modal{width:min(560px,100%);max-height:92dvh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(15,23,42,.22)}
    .modal-grip{width:44px;height:5px;background:#dbe3ec;border-radius:999px;margin:0 auto 15px}
    .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
    .modal-title{font-size:18px;font-weight:850}
    .modal-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
    .close-btn{border:0;background:#f1f5f9;border-radius:999px;width:34px;height:34px;font-size:18px;color:var(--muted);cursor:pointer}
    .field{margin-bottom:13px}
    .field label{display:block;font-size:11px;color:var(--muted);font-weight:750;margin-bottom:6px}
    .required{color:var(--danger)}
    .input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:12px 13px;outline:none;font-size:15px}
    .input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .textarea{min-height:76px;resize:vertical}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .panel{background:var(--surface2);border:1px solid var(--line);border-radius:15px;padding:13px;margin:14px 0}
    .panel-title{font-size:12px;font-weight:850;margin-bottom:10px}
    .help{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px}
    .check-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
    .check-row:last-child{border-bottom:0}
    .check-row input{width:20px;height:20px}
    .modal-actions{display:flex;gap:10px;margin-top:16px}
    .modal-actions button{flex:1}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:200;background:#0f172a;color:#fff;border-radius:999px;padding:10px 16px;font-size:12px;font-weight:750;box-shadow:var(--shadow);animation:fade .2s}
    @keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
    .hidden{display:none!important}
    @media(max-width:390px){
      .targets{grid-template-columns:1fr}
      .field-row{grid-template-columns:1fr}
      .hero-name{font-size:20px}
      .mileage{font-size:22px}
    }
  </style>
</head>
<body>
<div id="app"></div>
<input id="restoreInput" type="file" accept="application/json" hidden>
<script>
"use strict";

const STORAGE_KEY="maintenance_app_v1";
const APP_VERSION=2;
const TODAY=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};

const DEFAULT_CARS=[
  {id:1,name:"セレナ",maker:"Nissan",model:"Serena",year:2020,mileage:86000,plateNo:"",oilInterval:6000,oilType:"0W20",shakenExpiry:"",firstReg:"",carType:"C27",chassisNo:""},
  {id:2,name:"エブリィワゴン",maker:"Suzuki",model:"Every Wagon",year:2025,mileage:0,plateNo:"",oilInterval:3000,oilType:"5W30",shakenExpiry:"",firstReg:"",carType:"",chassisNo:""}
];

const ITEM_DEFS=[
  {id:"oil",label:"エンジンオイル",trackDate:true,trackKm:true,months:6,km:5000,note:"オイル銘柄・粘度など"},
  {id:"oilFilter",label:"オイルフィルター",trackDate:true,trackKm:true,months:12,km:10000,note:"フィルター型番など"},
  {id:"cvt",label:"CVTフルード",trackDate:true,trackKm:true,months:48,km:40000,note:"油種・交換方法など"},
  {id:"tire",label:"タイヤ交換",trackDate:true,trackKm:true,months:60,km:40000,note:"タイヤサイズ・銘柄など"},
  {id:"rotation",label:"タイヤローテーション",trackDate:true,trackKm:true,months:6,km:5000,note:"前後入替・クロスなど"},
  {id:"brake",label:"ブレーキ点検",trackDate:true,trackKm:true,months:12,km:20000,note:"パッド残量・異音など"},
  {id:"battery",label:"バッテリー",trackDate:true,trackKm:false,months:36,km:null,note:"型番・測定値など"},
  {id:"acFilter",label:"エアコンフィルター",trackDate:true,trackKm:true,months:12,km:15000,note:"品番・臭いの状態など"},
  {id:"airFilter",label:"エアクリーナー",trackDate:true,trackKm:true,months:24,km:30000,note:"品番・汚れ具合など"},
  {id:"wiper",label:"ワイパーゴム",trackDate:true,trackKm:false,months:12,km:null,note:"前後・サイズなど"},
  {id:"coolant",label:"冷却水",trackDate:true,trackKm:true,months:48,km:60000,note:"LLC/SLLC・補充量など"},
  {id:"inspection",label:"車検",trackDate:true,trackKm:false,months:24,km:null,note:"整備内容・依頼先など"}
];

const TYPE_MAP={filter:"acFilter"};
const DEF_BY_ID=id=>ITEM_DEFS.find(x=>x.id===id);

let state={tab:"dashboard",selectedCarId:null,modal:null,toast:""};
let data=loadData();

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:null}
function formatKm(v){return v==null||v===""?"—":Number(v).toLocaleString()+" km"}
function formatYen(v){return !v?"":Number(v).toLocaleString()+"円"}
function formatDate(v){if(!v)return "—";const p=v.slice(0,10).split("-");return `${Number(p[0])}年${Number(p[1])}月${Number(p[2])}日`}
function addMonths(dateStr,months){
  if(!dateStr||!months)return "";
  const p=dateStr.slice(0,10).split("-").map(Number);
  const d=new Date(p[0],p[1]-1,p[2]||1);
  const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(months));
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dayDiff(target){
  if(!target)return null;
  const a=new Date(TODAY()+"T00:00:00"),b=new Date(target.slice(0,10)+"T00:00:00");
  return Math.ceil((b-a)/86400000);
}
function newId(prefix){return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)}
function clone(v){return JSON.parse(JSON.stringify(v))}

function baseData(){
  return {version:APP_VERSION,cars:clone(DEFAULT_CARS),records:[],nextCarId:3,nextRecordId:1,itemSettings:{},customItems:[],targets:{},homeItems:[],homeOrder:[]};
}
function normalizeData(raw){
  const base=baseData(),src=raw&&typeof raw==="object"?raw:{};
  const cars=(Array.isArray(src.cars)&&src.cars.length?src.cars:base.cars).map((c,i)=>({
    id:c.id??i+1,name:c.name||`車${i+1}`,maker:c.maker||"",model:c.model||"",year:num(c.year)||"",
    mileage:num(c.mileage)||0,plateNo:c.plateNo||"",oilInterval:num(c.oilInterval)||5000,oilType:c.oilType||"",
    shakenExpiry:c.shakenExpiry||"",firstReg:c.firstReg||"",carType:c.carType||"",chassisNo:c.chassisNo||""
  }));
  const records=(Array.isArray(src.records)?src.records:[]).map((r,i)=>({
    ...r,id:r.id??i+1,carId:r.carId,type:TYPE_MAP[r.type]||r.type||"other",
    date:(r.date||r.oilDate||(TODAY())).slice(0,10).length===7?(r.date||r.oilDate)+"-01":(r.date||TODAY()).slice(0,10),
    mileage:num(r.mileage),cost:num(r.cost)||0,note:r.note||"",nextDate:r.nextDate||"",nextMileage:num(r.nextMileage)
  }));
  const customItems=Array.isArray(src.customItems)?clone(src.customItems):[];
  const customLegacy=Array.isArray(src.carCustomMaints)?src.carCustomMaints:[];
  customLegacy.forEach(cm=>{
    if(!customItems.some(x=>x.id===cm.id))customItems.push({
      id:cm.id||newId("custom"),carId:cm.carId,label:cm.label||"追加項目",
      trackDate:!!cm.intervalMonths||!!cm.lastDate,trackKm:!!cm.intervalKm||cm.lastMileage!=null,
      months:num(cm.intervalMonths),km:num(cm.intervalKm),note:""
    });
    if((cm.lastDate||cm.lastMileage!=null)&&!records.some(r=>r.carId===cm.carId&&r.type===cm.id)){
      records.push({id:newId("legacy"),carId:cm.carId,type:cm.id,date:(cm.lastDate||TODAY()).slice(0,10).length===7?(cm.lastDate+"-01"):(cm.lastDate||TODAY()),mileage:num(cm.lastMileage),cost:0,note:"旧データから移行",nextDate:cm.lastDate&&cm.intervalMonths?addMonths(cm.lastDate,cm.intervalMonths):"",nextMileage:cm.lastMileage!=null&&cm.intervalKm?Number(cm.lastMileage)+Number(cm.intervalKm):null});
    }
  });
  const itemSettings=clone(src.itemSettings||{});
  cars.forEach(car=>{
    itemSettings[car.id]=itemSettings[car.id]||{};
    ITEM_DEFS.forEach(def=>{
      const old=itemSettings[car.id][def.id]||{};
      itemSettings[car.id][def.id]={
        enabled:old.enabled!==false,
        trackDate:old.trackDate??def.trackDate,
        trackKm:old.trackKm??def.trackKm,
        months:num(old.months)??(def.id==="oil"?(num(car.oilMonths)||6):def.months),
        km:num(old.km)??(def.id==="oil"?(num(car.oilInterval)||def.km):def.km)
      };
    });
  });
  const targets=clone(src.targets||{});
  if(src.carItemOrders){
    // 並び順は新版では固定。古い記録自体は保持する。
  }
  const maxCar=Math.max(0,...cars.map(c=>num(c.id)||0));
  const numericIds=records.map(r=>num(r.id)).filter(v=>v!=null);
  return {...base,...src,version:APP_VERSION,cars,records,itemSettings,customItems,targets,
    nextCarId:Math.max(num(src.nextCarId)||0,maxCar+1),
    nextRecordId:Math.max(num(src.nextRecordId)||0,(numericIds.length?Math.max(...numericIds)+1:1))
  };
}
function loadData(){
  try{const raw=localStorage.getItem(STORAGE_KEY);return normalizeData(raw?JSON.parse(raw):baseData())}
  catch(e){return normalizeData(baseData())}
}
function persist(show=true){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  if(show)toast("保存しました");
}
function toast(msg){
  state.toast=msg;render();
  setTimeout(()=>{if(state.toast===msg){state.toast="";render()}},1800);
}

function selectedCar(){
  if(!state.selectedCarId||!data.cars.some(c=>String(c.id)===String(state.selectedCarId)))state.selectedCarId=data.cars[0]?.id??null;
  return data.cars.find(c=>String(c.id)===String(state.selectedCarId))||null;
}
function getItems(car){
  if(!car)return [];
  const standard=ITEM_DEFS.map(def=>{
    const s=data.itemSettings?.[car.id]?.[def.id]||{};
    return {...def,...s,custom:false};
  });
  const custom=(data.customItems||[]).filter(x=>String(x.carId)===String(car.id)).map(x=>({
    id:x.id,label:x.label,trackDate:x.trackDate!==false,trackKm:!!x.trackKm,months:num(x.months),km:num(x.km),note:x.note||"メモ",enabled:x.enabled!==false,custom:true
  }));
  return [...standard,...custom].filter(x=>x.enabled!==false);
}
function getItem(car,type){
  return getItems(car).find(x=>x.id===type)||null;
}
function latestRecord(carId,type){
  return data.records.filter(r=>String(r.carId)===String(carId)&&r.type===type)
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||String(b.id).localeCompare(String(a.id)))[0]||null;
}
function targetKey(carId,type){return `${carId}|${type}`}
function getTarget(car,item,last){
  const override=data.targets[targetKey(car.id,item.id)]||{};
  let nextDate=override.nextDate??last?.nextDate??"";
  let nextMileage=override.nextMileage??last?.nextMileage??null;
  if(!nextDate&&last?.date&&item.trackDate&&item.months)nextDate=addMonths(last.date,item.months);
  if(nextMileage==null&&last?.mileage!=null&&item.trackKm&&item.km)nextMileage=Number(last.mileage)+Number(item.km);
  if(item.id==="inspection"&&!nextDate&&car.shakenExpiry)nextDate=car.shakenExpiry;
  return {nextDate:nextDate||"",nextMileage:num(nextMileage)};
}
function itemStatus(car,item){
  const last=latestRecord(car.id,item.id);
  const target=getTarget(car,item,last);
  const days=item.trackDate&&target.nextDate?dayDiff(target.nextDate):null;
  const kmLeft=item.trackKm&&target.nextMileage!=null?target.nextMileage-(car.mileage||0):null;
  let level="none",label="未登録";
  if(last||target.nextDate||target.nextMileage!=null){level="ok";label="余裕あり"}
  if((days!=null&&days<=30)||(kmLeft!=null&&kmLeft<=1000)){level="soon";label="まもなく"}
  if((days!=null&&days<0)||(kmLeft!=null&&kmLeft<=0)){level="overdue";label="期限超過"}
  return {item,last,...target,days,kmLeft,level,label};
}
function allStatuses(car){
  return getItems(car).map(i=>itemStatus(car,i));
}
function dateRemainText(days){
  if(days==null)return "日付目安なし";
  if(days<0)return `${Math.abs(days)}日超過`;
  if(days===0)return "今日が目安";
  return `あと${days}日`;
}
function kmRemainText(km){
  if(km==null)return "距離目安なし";
  if(km<=0)return `${Math.abs(km).toLocaleString()}km超過`;
  return `あと${km.toLocaleString()}km`;
}
function intervalText(item){
  const parts=[];
  if(item.trackDate&&item.months)parts.push(`${item.months}ヶ月`);
  if(item.trackKm&&item.km)parts.push(`${Number(item.km).toLocaleString()}km`);
  return parts.length?parts.join(" または "):"次回目標を手動設定";
}

  root.innerHTML=`

    </div>

}

function renderDashboard(car){
  if(!car)return `<div class="empty">車両を追加してください</div>`;
  const stats=allStatuses(car);
  const overdue=stats.filter(x=>x.level==="overdue").length;
  const soon=stats.filter(x=>x.level==="soon").length;
  const done=stats.filter(x=>x.last).length;
  const sorted=[...stats].sort((a,b)=>({overdue:0,soon:1,none:2,ok:3}[a.level]-{overdue:0,soon:1,none:2,ok:3}[b.level]));
  return `
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-name">${esc(car.name)}</div>
          <div class="hero-sub">${esc([car.plateNo,car.carType&&`型式 ${car.carType}`,car.oilType&&`オイル ${car.oilType}`].filter(Boolean).join(" ・ ")||"車両情報は設定から入力できます")}</div>
        </div>
        <div class="mileage-box">
          <div class="mileage-label">現在の走行距離</div>
          <div class="mileage">${Number(car.mileage||0).toLocaleString()} <span>km</span></div>
          <button class="hero-btn" data-action="open-mileage">更新する</button>
        </div>
      </div>
      <div class="summary">
        <div class="summary-box"><div class="summary-num">${overdue}</div><div class="summary-label">期限超過</div></div>
        <div class="summary-box"><div class="summary-num">${soon}</div><div class="summary-label">まもなく</div></div>
        <div class="summary-box"><div class="summary-num">${done}</div><div class="summary-label">記録済み</div></div>
      </div>
    </section>
    <div class="section-head">
      <div><div class="section-title">メンテナンス項目</div><div class="section-note">期限が近い順に表示</div></div>
      <button class="ghost-btn" data-action="add-item">＋ 項目追加</button>
    </div>
    <div class="maint-list">
      ${sorted.map(s=>renderMaintCard(car,s)).join("")||`<div class="empty">表示する項目がありません</div>`}
    </div>`;
}
function renderMaintCard(car,s){
  const {item,last,nextDate,nextMileage,days,kmLeft,level,label}=s;
  const lastParts=[];
  if(last?.date)lastParts.push(formatDate(last.date));
  if(last?.mileage!=null)lastParts.push(formatKm(last.mileage));
  if(last?.cost)lastParts.push(formatYen(last.cost));
  return `<article class="maint-card ${level}">
    <div class="maint-head">
      <div><div class="maint-name">${esc(item.label)}</div><div class="section-note">${esc(intervalText(item))}</div></div>
      <span class="status ${level}">${label}</span>
    </div>
    <div class="targets">
      ${item.trackDate?`<div class="target"><div class="target-label">次回の目安日</div><div class="target-value">${nextDate?formatDate(nextDate):"未設定"}</div><div class="target-remain">${dateRemainText(days)}</div></div>`:""}
      ${item.trackKm?`<div class="target"><div class="target-label">次回の交換距離</div><div class="target-value">${nextMileage!=null?formatKm(nextMileage):"未設定"}</div><div class="target-remain">${kmRemainText(kmLeft)}</div></div>`:""}
      ${!item.trackDate&&!item.trackKm?`<div class="target"><div class="target-label">管理方法</div><div class="target-value">記録のみ</div><div class="target-remain">必要に応じて目安を設定できます</div></div>`:""}
    </div>
    <div class="last-line">${last?`前回：${esc(lastParts.join(" ・ "))}${last.note?`<br>${esc(last.note)}`:""}`:"まだ記録がありません"}</div>
    <div class="card-actions">
      <button class="record-small" data-action="record-item" data-type="${esc(item.id)}">交換・点検を記録</button>
      <button class="setting-small" data-action="item-settings" data-type="${esc(item.id)}">目安設定</button>
    </div>
  </article>`;
}

    <div class="section-head"><div><div class="section-title">${esc(car.name)} の履歴</div><div class="section-note">${recs.length}件</div></div></div>

function modalShell(title,sub,body,actions=""){
  return `<div class="modal-bg" data-action="close-modal"><section class="modal">

    ${body}${actions}
  </section></div>`;
}
function inputField(id,label,value,type="text",required=false,placeholder=""){
  return `<div class="field"><label for="${id}">${esc(label)}${required?` <span class="required">*</span>`:""}</label><input id="${id}" class="input" type="${type}" value="${esc(value??"")}" placeholder="${esc(placeholder)}"></div>`;
}
function textareaField(id,label,value,placeholder=""){
  return `<div class="field"><label for="${id}">${esc(label)}</label><textarea id="${id}" class="textarea" placeholder="${esc(placeholder)}">${esc(value||"")}</textarea></div>`;
}

function openRecord(type,recordId=null){
  const car=selectedCar(),item=getItem(car,type);
  if(!item)return;
  const existing=recordId!=null?data.records.find(r=>String(r.id)===String(recordId)):null;
  const date=existing?.date||TODAY();
  const mileage=existing?.mileage??(item.trackKm?car.mileage:"");
  const nextDate=existing?.nextDate||(item.trackDate&&item.months?addMonths(date,item.months):"");
  const nextMileage=existing?.nextMileage??(item.trackKm&&item.km&&mileage!==""?Number(mileage)+Number(item.km):null);
  state.modal={kind:"record",type,recordId:existing?.id??null,form:{date,mileage,cost:existing?.cost||"",note:existing?.note||"",nextDate,nextMileage}};
  render();
}
function openItemSettings(type){
  const car=selectedCar(),item=getItem(car,type),last=latestRecord(car.id,type),target=getTarget(car,item,last);
  state.modal={kind:"itemSettings",type,form:{label:item.label,trackDate:item.trackDate,trackKm:item.trackKm,months:item.months,km:item.km,nextDate:target.nextDate,nextMileage:target.nextMileage}};
  render();
}
function readValue(id){return document.getElementById(id)?.value??""}
function readCheck(id){return !!document.getElementById(id)?.checked}

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action,car=selectedCar();
  // モーダル背景を直接タップした時だけ閉じる。中の入力欄やボタンのクリックは通す。
  if(a==="close-modal"&&el.classList.contains("modal-bg")&&ev.target!==el)return;
  if(a==="tab"){state.tab=el.dataset.tab;state.modal=null;render()}
  else if(a==="select-car"){state.selectedCarId=el.dataset.id;state.modal=null;render()}
  else if(a==="open-mileage"&&car){state.modal={kind:"mileage"};render()}
  else if(a==="quick-record"&&car){state.modal={kind:"quickRecord"};render()}
  else if(a==="record-item"){openRecord(el.dataset.type)}
  else if(a==="item-settings"){openItemSettings(el.dataset.type)}
  else if(a==="close-modal"){state.modal=null;render()}
  else if(a==="save-mileage")saveMileage()
  else if(a==="save-record")saveRecord()
  else if(a==="delete-record")deleteRecord()
  else if(a==="recalc-target")recalcTarget()
  else if(a==="save-item-settings")saveItemSettings()
  else if(a==="add-car"){state.modal={kind:"car",mode:"add",form:{name:"",mileage:0,plateNo:"",carType:"",oilType:"",firstReg:"",shakenExpiry:"",chassisNo:""}};render()}
  else if(a==="edit-car"&&car){state.modal={kind:"car",mode:"edit",form:clone(car)};render()}
  else if(a==="save-car")saveCar()
  else if(a==="delete-car")deleteCar()
  else if(a==="add-item"&&car){state.modal={kind:"addItem",form:{label:"",trackDate:true,trackKm:false,months:12,km:"",note:""}};render()}
  else if(a==="save-new-item")saveNewItem()
  else if(a==="delete-item")deleteItem()
  else if(a==="edit-record"){const r=data.records.find(x=>String(x.id)===String(el.dataset.id));if(r)openRecord(r.type,r.id)}
  else if(a==="backup")backupData()
  else if(a==="restore")document.getElementById("restoreInput").click()
});

function saveMileage(){
  const car=selectedCar(),v=num(readValue("mileageInput"));
  if(v==null||v<0)return toast("走行距離を入力してください");
  data.cars=data.cars.map(c=>String(c.id)===String(car.id)?{...c,mileage:v}:c);
  state.modal=null;persist();
}
function recalcTarget(){
  const car=selectedCar(),item=getItem(car,state.modal.type);
  const date=readValue("recordDate")||TODAY();
  const mileage=num(readValue("recordMileage"));
  const nd=item.trackDate&&item.months?addMonths(date,item.months):"";
  const nk=item.trackKm&&item.km&&mileage!=null?mileage+Number(item.km):"";
  const dEl=document.getElementById("recordNextDate"),kEl=document.getElementById("recordNextMileage");
  if(dEl)dEl.value=nd;if(kEl)kEl.value=nk;
}
function saveRecord(){
  const car=selectedCar(),m=state.modal,item=getItem(car,m.type);
  const date=readValue("recordDate"),mileage=item.trackKm?num(readValue("recordMileage")):null;
  if(!date)return toast("交換・点検日を入力してください");
  if(item.trackKm&&mileage==null)return toast("走行距離を入力してください");
  const record={
    id:m.recordId??data.nextRecordId,carId:car.id,type:item.id,date,mileage,
    cost:num(readValue("recordCost"))||0,note:readValue("recordNote").trim(),
    nextDate:item.trackDate?readValue("recordNextDate"):"",
    nextMileage:item.trackKm?num(readValue("recordNextMileage")):null
  };
  if(m.recordId!=null)data.records=data.records.map(r=>String(r.id)===String(m.recordId)?record:r);
  else{data.records.push(record);data.nextRecordId=(num(data.nextRecordId)||1)+1}
  data.targets[targetKey(car.id,item.id)]={nextDate:record.nextDate||"",nextMileage:record.nextMileage};
  if(mileage!=null&&mileage>(car.mileage||0))data.cars=data.cars.map(c=>String(c.id)===String(car.id)?{...c,mileage}:c);
  if(item.id==="inspection"&&record.nextDate)data.cars=data.cars.map(c=>String(c.id)===String(car.id)?{...c,shakenExpiry:record.nextDate}:c);
  state.modal=null;persist();
}
function deleteRecord(){
  const m=state.modal;if(m.recordId==null)return;
  if(!confirm("この記録を削除しますか？"))return;
  const rec=data.records.find(r=>String(r.id)===String(m.recordId));
  data.records=data.records.filter(r=>String(r.id)!==String(m.recordId));
  const car=selectedCar(),item=getItem(car,rec.type),last=latestRecord(car.id,rec.type);
  if(last)data.targets[targetKey(car.id,rec.type)]={nextDate:last.nextDate||"",nextMileage:last.nextMileage??null};
  else delete data.targets[targetKey(car.id,rec.type)];
  state.modal=null;persist();
}
function saveItemSettings(){
  const car=selectedCar(),m=state.modal,item=getItem(car,m.type);
  const trackDate=readCheck("trackDate"),trackKm=readCheck("trackKm");
  const months=num(readValue("settingMonths")),km=num(readValue("settingKm"));
  if(item.custom){
    data.customItems=data.customItems.map(x=>x.id===item.id?{...x,label:readValue("settingLabel").trim()||x.label,trackDate,trackKm,months,km}:x);
  }else{
    data.itemSettings[car.id]=data.itemSettings[car.id]||{};
    data.itemSettings[car.id][item.id]={...(data.itemSettings[car.id][item.id]||{}),enabled:true,trackDate,trackKm,months,km};
    if(item.id==="oil"&&km)data.cars=data.cars.map(c=>String(c.id)===String(car.id)?{...c,oilInterval:km}:c);
  }
  data.targets[targetKey(car.id,item.id)]={nextDate:trackDate?readValue("settingNextDate"):"",nextMileage:trackKm?num(readValue("settingNextKm")):null};
  state.modal=null;persist();
}
function saveCar(){
  const m=state.modal,name=readValue("carName").trim(),mileage=num(readValue("carMileage"));
  if(!name)return toast("車両名を入力してください");
  if(mileage==null)return toast("走行距離を入力してください");
  const obj={...m.form,name,mileage,plateNo:readValue("carPlate").trim(),carType:readValue("carType").trim(),oilType:readValue("carOilType").trim(),firstReg:readValue("carFirstReg"),shakenExpiry:readValue("carShaken"),chassisNo:readValue("carChassis").trim()};
  if(m.mode==="add"){
    obj.id=data.nextCarId;data.nextCarId++;
    data.cars.push(obj);data.itemSettings[obj.id]={};
    ITEM_DEFS.forEach(def=>data.itemSettings[obj.id][def.id]={enabled:true,trackDate:def.trackDate,trackKm:def.trackKm,months:def.months,km:def.id==="oil"?5000:def.km});
    state.selectedCarId=obj.id;
  }else data.cars=data.cars.map(c=>String(c.id)===String(obj.id)?obj:c);
  state.modal=null;persist();
}
function deleteCar(){
  const car=selectedCar();if(data.cars.length<=1)return;
  if(!confirm(`${car.name}とその履歴を削除しますか？`))return;
  data.cars=data.cars.filter(c=>String(c.id)!==String(car.id));
  data.records=data.records.filter(r=>String(r.carId)!==String(car.id));
  data.customItems=data.customItems.filter(i=>String(i.carId)!==String(car.id));
  delete data.itemSettings[car.id];
  Object.keys(data.targets).filter(k=>k.startsWith(car.id+"|")).forEach(k=>delete data.targets[k]);
  state.selectedCarId=data.cars[0].id;state.modal=null;persist();
}
function saveNewItem(){
  const car=selectedCar(),label=readValue("newItemLabel").trim();
  if(!label)return toast("項目名を入力してください");
  const item={id:newId("custom"),carId:car.id,label,trackDate:readCheck("newTrackDate"),trackKm:readCheck("newTrackKm"),months:num(readValue("newMonths")),km:num(readValue("newKm")),note:readValue("newItemNote").trim(),enabled:true};
  data.customItems.push(item);state.modal=null;persist();
}
function deleteItem(){
  const car=selectedCar(),type=state.modal.type;
  if(!confirm("この項目と関連する履歴を削除しますか？"))return;
  data.customItems=data.customItems.filter(i=>i.id!==type);
  data.records=data.records.filter(r=>!(String(r.carId)===String(car.id)&&r.type===type));
  delete data.targets[targetKey(car.id,type)];
  state.modal=null;persist();
}
function backupData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`car-maintenance-backup-${TODAY()}.json`;a.click();URL.revokeObjectURL(url);toast("バックアップを保存しました");
}
document.getElementById("restoreInput").addEventListener("change",ev=>{
  const file=ev.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const restored=normalizeData(JSON.parse(reader.result));
      if(!confirm("現在のデータをバックアップ内容で置き換えますか？"))return;
      data=restored;state.selectedCarId=data.cars[0]?.id??null;persist(false);state.tab="dashboard";toast("バックアップを読み込みました");
    }catch(e){toast("バックアップを読み込めませんでした")}
    ev.target.value="";
  };
  reader.readAsText(file);
});

persist(false);
render();
</script>
</body>
</html>
